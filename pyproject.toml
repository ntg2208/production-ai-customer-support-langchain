[project]
name = "ukconnect-langchain"
version = "0.1.0"
description = "UKConnect AI Customer Support - LangGraph version"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-community>=0.3.0,<0.5.0",
    "langgraph>=1.0,<2.0",
    "langchain-google-genai>=2.0,<5.0",
    "langsmith>=0.3.0",
    "faiss-cpu>=1.7",
    "python-dotenv>=1.0",
    "numpy>=1.24",
]

[tool.hatch.build.targets.wheel]
packages = ["utils", "config", "database", "tools", "sub_agents"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
